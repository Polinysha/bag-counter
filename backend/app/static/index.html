<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Подсчёт мешков на конвейере</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  button { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
  button:disabled { background: #93c5fd; cursor: not-allowed; }
  progress { width: 100%; height: 18px; }
  #log { font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; background: #f7f7f7; padding: 10px; border-radius: 6px; max-height: 240px; overflow-y: auto; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; color: white; }
  .queued { background: #6b7280; } .processing { background: #d97706; }
  .done { background: #16a34a; } .failed { background: #dc2626; }
  a.download { display: inline-block; margin-top: 8px; }
  .error-banner {
    display: none; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
    padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem;
  }
  .error-banner.visible { display: block; }
  .key-row { display: flex; gap: 8px; align-items: center; }
  .key-row input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Подсчёт мешков на конвейере</h1>

  <div class="error-banner" id="errorBanner"></div>

  <div class="card">
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="API-ключ (если сервер требует)"/>
    </div>
  </div>

  <div class="card">
    <input type="file" id="file" accept="video/*"/>
    <button id="uploadBtn">Загрузить и обработать</button>
  </div>

  <div class="card" id="statusCard" style="display:none">
    <div>Job: <code id="jobId"></code> <span class="badge" id="statusBadge"></span></div>
    <progress id="progress" value="0" max="100"></progress>
    <div id="progressText"></div>
    <div id="resultArea"></div>
  </div>

  <div class="card">
    <h3>Лог аномалий</h3>
    <div id="log">—</div>
  </div>

<script>
const API = "/api/v1/videos";
let pollTimer = null;
// after this many consecutive failed polls, stop and surface an error -
// a single blip (e.g. one dropped request) shouldn't kill the whole
// progress view, but a server that's genuinely down should.
const MAX_CONSECUTIVE_POLL_FAILURES = 4;
let consecutivePollFailures = 0;

// Persisted per-tab (not permanently) so a reload doesn't force
// re-entering the key, but it's never written to localStorage/disk.
const apiKeyInput = document.getElementById("apiKey");
apiKeyInput.value = sessionStorage.getItem("bagCounterApiKey") || "";
apiKeyInput.addEventListener("input", () => {
  sessionStorage.setItem("bagCounterApiKey", apiKeyInput.value);
});

function showError(message) {
  const banner = document.getElementById("errorBanner");
  banner.textContent = message;
  banner.classList.add("visible");
}

function clearError() {
  const banner = document.getElementById("errorBanner");
  banner.classList.remove("visible");
  banner.textContent = "";
}

// Wraps fetch with: the API-key header (only needed if the server was
// started with BC_API_KEY set - see .env.example; harmless/no-op
// otherwise), network-error handling (fetch() itself only rejects on
// network failure, not on 4xx/5xx), and non-OK-status handling with a
// specific message for 401 so a wrong/missing key is obvious rather
// than looking like a generic server error.
async function apiFetch(url, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (apiKeyInput.value) headers["X-API-Key"] = apiKeyInput.value;

  let response;
  try {
    response = await fetch(url, { ...options, headers });
  } catch (networkErr) {
    throw new Error("Не удалось связаться с сервером. Проверьте соединение и повторите попытку.");
  }
  if (response.status === 401) {
    throw new Error("Неверный или отсутствующий API-ключ. Введите его в поле выше.");
  }
  if (!response.ok) {
    let detail = `Ошибка сервера (HTTP ${response.status})`;
    try {
      const body = await response.json();
      if (body && body.detail) detail = body.detail;
    } catch { /* body wasn't JSON - keep the generic message above */ }
    throw new Error(detail);
  }
  return response.json();
}

document.getElementById("uploadBtn").onclick = async () => {
  const f = document.getElementById("file").files[0];
  if (!f) { showError("Выберите видео перед загрузкой."); return; }
  clearError();

  const btn = document.getElementById("uploadBtn");
  btn.disabled = true;
  try {
    const fd = new FormData();
    fd.append("file", f);
    const up = await apiFetch(API, { method: "POST", body: fd });
    await apiFetch(`${API}/${up.id}/process`, { method: "POST" });

    document.getElementById("statusCard").style.display = "block";
    document.getElementById("jobId").textContent = up.id;
    document.getElementById("resultArea").innerHTML = "";
    document.getElementById("log").textContent = "—";
    poll(up.id);
  } catch (err) {
    showError(err.message);
  } finally {
    btn.disabled = false;
  }
};

function badgeClass(status) { return status; }

async function poll(id) {
  clearInterval(pollTimer);
  consecutivePollFailures = 0;

  pollTimer = setInterval(async () => {
    let s;
    try {
      s = await apiFetch(`${API}/${id}`);
      consecutivePollFailures = 0;
    } catch (err) {
      consecutivePollFailures += 1;
      if (consecutivePollFailures >= MAX_CONSECUTIVE_POLL_FAILURES) {
        clearInterval(pollTimer);
        showError(`Потеряна связь с сервером при отслеживании задачи: ${err.message}`);
      }
      return;
    }

    document.getElementById("statusBadge").textContent = s.status;
    document.getElementById("statusBadge").className = "badge " + badgeClass(s.status);
    document.getElementById("progress").value = s.progress_pct;
    document.getElementById("progressText").textContent =
      `${s.processed_frames} / ${s.total_frames ?? "?"} кадров — мешков посчитано: ${s.bag_count} — аномалий: ${s.anomalies_count}`;

    if (s.status === "done") {
      clearInterval(pollTimer);
      renderDownloadLink(id);
      loadAnomalies(id);
    }
    if (s.status === "failed") {
      clearInterval(pollTimer);
      document.getElementById("resultArea").textContent = "Ошибка обработки: " + (s.error ?? "неизвестная ошибка");
    }
  }, 1500);
}

// A plain <a href> can't attach the X-API-Key header, so when a key is
// set the download has to go through fetch() (like every other call)
// and be turned into a Blob URL instead of a direct link.
async function renderDownloadLink(id) {
  const area = document.getElementById("resultArea");
  if (!apiKeyInput.value) {
    area.innerHTML = `<a class="download" href="${API}/${id}/result">Скачать обработанное видео</a>`;
    return;
  }
  area.innerHTML = `<button id="downloadBtn">Скачать обработанное видео</button>`;
  document.getElementById("downloadBtn").onclick = async () => {
    try {
      const response = await fetch(`${API}/${id}/result`, { headers: { "X-API-Key": apiKeyInput.value } });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${id}_processed.mp4`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      showError("Не удалось скачать результат: " + err.message);
    }
  };
}

async function loadAnomalies(id) {
  let data;
  try {
    data = await apiFetch(`${API}/${id}/anomalies`);
  } catch (err) {
    document.getElementById("log").textContent = "Не удалось загрузить список аномалий: " + err.message;
    return;
  }
  const log = document.getElementById("log");
  if (!data.anomalies.length) { log.textContent = "Аномалий не обнаружено."; return; }
  log.textContent = data.anomalies
    .map(a => `[${a.timestamp_sec.toFixed(1)}s] (${a.severity}) ${a.type}: ${a.message}`)
    .join("\n");
}
</script>
</body>
</html>

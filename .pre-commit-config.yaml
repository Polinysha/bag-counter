default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
  - repo: local
    hooks:
      - id: requirements-sync
        name: dev.txt includes base.txt + cv.txt
        entry: bash -c 'grep -q "\-r base.txt" backend/requirements/dev.txt && grep -q "\-r cv.txt" backend/requirements/dev.txt'
        language: system
        pass_filenames: false
        files: ^backend/requirements/

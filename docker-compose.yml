services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - BC_REDIS_URL=redis://redis:6379/0
      - BC_DATA_DIR=/data
      - BC_MMDET_DEVICE=${MMDET_DEVICE:-cpu}
      - BC_MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-2048}
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: ./backend
    restart: unless-stopped
    environment:
      - BC_REDIS_URL=redis://redis:6379/0
      - BC_DATA_DIR=/data
      - BC_MMDET_DEVICE=${MMDET_DEVICE:-cpu}
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker.run_worker"]

name: CI

# Runs on every push to a feature/* branch's PR into dev, and on PRs
# from dev into main (see CONTRIBUTING.md for the branching model).
# main and dev are protected: this workflow is a required check before
# either can be merged into.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  commit-messages:
    # Only meaningful on a PR (a range of new commits to check) - not
    # on push, where the commits were already checked when their PR
    # was open. Defense in depth for the local commit-msg hook
    # (.pre-commit-config.yaml's conventional-pre-commit): a commit
    # made with `git commit --no-verify`, or one from before the hook
    # existed, still gets caught here before merge.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages follow Conventional Commits
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1000
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+'
          bad=0
          while IFS= read -r subject; do
            if ! echo "$subject" | grep -qE "$pattern"; then
              echo "::error::Commit message does not follow Conventional Commits: $subject"
              bad=1
            fi
          done < <(git log --no-merges "origin/${{ github.base_ref }}..HEAD" --format=%s)
          exit "$bad"

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r backend/requirements/dev.txt
      - run: cd backend && ruff check .
      - run: cd backend && ruff format --check .
      - run: cd backend && mypy .

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r backend/requirements/dev.txt
      - run: cd backend && pytest --cov=app --cov-report=xml -q
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: backend/coverage.xml

  lite-docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7
      # Sanity check that the image still builds - lite (SKIP_ML_STACK=true),
      # not the full ML image, to keep CI fast. The full image is built
      # manually / on release, see ROADMAP.md "CI: build & publish the
      # full image on release tags".
      - run: docker build --build-arg SKIP_ML_STACK=true -t bag-counter:ci-lite backend

name: Release Image

# Builds and publishes the FULL image (with the MMDetection/torch
# stack - see backend/Dockerfile ARG SKIP_ML_STACK, default false)
# to GitHub Container Registry whenever a version tag (v1.2.3 style)
# is pushed.
#
# This is deliberately separate from .github/workflows/ci.yml: that
# workflow's lite-docker-build job (SKIP_ML_STACK=true) runs on every
# PR as a fast sanity check that the image still builds at all: no
# torch/mmdet download, no push anywhere. This workflow is the actual
# deployable artifact, only built on a real release (so multi-GB
# ML-stack downloads don't happen on every PR) and pushed so
# `docker pull ghcr.io/<owner>/bag-counter:vX.Y.Z` works without
# anyone building it themselves.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io requires a lowercase image path; github.repository
      # keeps the repo's actual casing (e.g. "Polinysha/bag-counter"),
      # which GHCR rejects.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          build-args: |
            SKIP_ML_STACK=false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
